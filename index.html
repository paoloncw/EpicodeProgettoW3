<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Tracker — Settimana III</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <header>
    <div>
      <h1>Il mio Movie Tracker</h1>
      <p>Aggiungi i film che hai visto e dai un voto da 1 a 5.</p>
    </div>
    <button id="btn-tema" type="button">Tema scuro</button>
  </header>

  <main>

    <section class="form">
      <h2>Aggiungi un film</h2>
      <form id="form-film">
        <input type="text" id="titolo" placeholder="Titolo">
        <input type="text" id="regista" placeholder="Regista">
        <input type="number" id="voto" placeholder="Voto (1-5)">
        <button type="submit">Aggiungi</button>
      </form>
      <p id="errore"></p>
    </section>

    <section class="controlli">
      <input type="search" id="ricerca" placeholder="Cerca per titolo o regista">
    </section>

    <section class="statistiche">
      <div class="contatori">
        <div class="contatore">
          <strong id="stat-totale">0</strong>
          <span>Film totali</span>
        </div>
        <div class="contatore">
          <strong id="stat-media">0</strong>
          <span>Voto medio</span>
        </div>
      </div>
      <div class="barra-etichetta">
        <span>Film piaciuti (voto 4 o 5)</span>
        <span id="stat-percentuale">0%</span>
      </div>
      <div class="barra">
        <div id="barra-piene"></div>
      </div>
    </section>

    <section class="lista" id="lista">
    </section>

    <div id="notifica"></div>

  </main>

  <footer>
    <p>Movie Tracker — Paolo, 2026</p>
  </footer>

  <script src="assets/js/script.js"></script>
</body>
</html>
